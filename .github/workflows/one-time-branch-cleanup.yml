name: One-time stale branch cleanup

on:
  push:
    branches:
      - test/ci-quality-gates

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete consolidated branches
    runs-on: ubuntu-latest
    if: github.repository == 'adith92/NgajiYuk'
    steps:
      - name: Delete stale remote branches
        uses: actions/github-script@v7
        with:
          script: |
            const staleBranches = [
              'feature/ui-ux-kids-dashboard',
              'refactor/code-structure',
              'chore/production-readiness',
              'ecc-tools/NgajiYuk-1783850102789',
              'docs/sync-readme-app-status',
            ];

            const protectedBranches = new Set(['main', 'test/ci-quality-gates']);

            for (const branch of staleBranches) {
              if (protectedBranches.has(branch)) {
                core.setFailed(`Refusing to delete protected branch: ${branch}`);
                return;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent: ${branch}`);
                  continue;
                }
                throw error;
              }
            }
